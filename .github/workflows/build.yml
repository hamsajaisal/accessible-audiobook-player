name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Install NSIS
        run: |
          choco install nsis -y

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconsole --onefile --name "AccessibleAudiobookPlayer" accessible_player.py

      - name: Compile NSIS Windows Installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" setup.nsi

      - name: Zip Executable
        run: |
          Compress-Archive -Path dist/AccessibleAudiobookPlayer.exe -DestinationPath dist/AccessibleAudiobookPlayer-v1.1.2-win.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AccessibleAudiobookPlayer-Setup.exe
            dist/AccessibleAudiobookPlayer-v1.1.2-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
